[package]
name = "ven-shim"
version = "0.0.1"
edition = "2021"

[[bin]]
name = "Ven"
path = "src/main.rs"

[dependencies]
ureq = "2.10"
url = "2"
sha1 = "0.10"
md-5 = "0.10"
tungstenite = "0.24"
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
